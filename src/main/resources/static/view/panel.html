<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObsidianGate - Panel</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/panel/panel.css">
</head>
<body>
<div class="panel-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../image/icon/portal-icon.gif" alt="Logo" class="logo-img">
            <span>ObsidianGate</span>
        </div>

        <nav class="sidebar-menu">
            <button onclick="router.load('home')" class="menu-item active">
                <i>🏠</i> Home
            </button>
            <button onclick="router.load('servers')" class="menu-item">
                <i>🖥️</i> Server
            </button>
            <button onclick="router.load('users')" class="menu-item">
                <i>👥</i> Users
            </button>
            <button onclick="router.load('settings')" class="menu-item">
                <i>⚙️</i> Settings
            </button>
        </nav>

        <div class="sidebar-user">
            <div class="user-info">
                <p id="txt-username">Loading...</p>
                <small>Admin</small>
            </div>
            <button onclick="logout()" class="btn-logout">Log out</button>
            <div class="credits">
                <p>Created by <a href="https://github.com/oZaGGo" target="_blank">@ZaGG</a></p>
            </div>
        </div>
    </aside>

    <main class="main-content" id="view-container">
    </main>
</div>

<script src="../js/auth.js"></script>
<script src="../js/panel.js"></script>
</body>
</html>
