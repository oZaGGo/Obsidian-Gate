<div class="fade-in">
    <div class="header-section">
        <h1>Dashboard</h1>
        <div class="status-indicator">
            <span class="dot" id="server-status-dot"></span>
            <span id="server-status-text"></span>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>CPU Usage</h3>
            <p class="stat-value" id="cpu-usage">0%</p>
            <div class="progress-bar">
                <div id="bar-cpu" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div class="stat-card">
            <h3>RAM Usage</h3>
            <p class="stat-value" id="ram-usage">0 GB <span class="total-ram">/ 0 GB</span></p>
            <div class="progress-bar">
                <div id="bar-ram" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>
        <div class="stat-card">
            <h3>Uptime</h3>
            <p class="stat-value" id="status">00:00:00</p>
        </div>
    </div>

    <div class="control-actions">
        <button class="btn btn-start" onclick="controlServer('start')">Start</button>
        <button class="btn btn-restart" onclick="controlServer('restart')">Restart</button>
        <button class="btn btn-stop" onclick="controlServer('stop')">Stop</button>
    </div>

    <div class="console-container home-scrollbar">
        <div class="console-header">
            <span>Terminal Output</span>
        </div>
        <div class="console-body" id="console-output">
        </div>
        <div class="console-input">
            <span class="prompt">></span>
            <input type="text" placeholder="Send command..." id="cmd-input" onkeypress="if(event.key === 'Enter') sendCommand()">
        </div>
    </div>
</div>
