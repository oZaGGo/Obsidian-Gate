<div class="fade-in settings-container">
    <!-- HEADER -->
    <div class="header-section">
        <h1>Backup Management</h1>
        <p style="color: #888;">Manage your Minecraft server backups</p>
    </div>

    <div class="settings-grid">
        <!-- CARD: CREATE MANUAL BACKUP -->
        <div class="settings-card">
            <h3>Create New Backup</h3>
            <div class="input-group" style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                <div class="field-container">
                    <label for="backup-alias" style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc;">Backup Alias</label>
                    <input type="text" id="backup-alias" placeholder=""
                           style="width: 100%; padding: 10px; border-radius: 4px; background: #1a1a1a; color: white; border: 1px solid #444; box-sizing: border-box;">
                </div>
                <div class="field-container">
                    <label for="backup-world" style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc;">Backup World</label>
                    <input type="text" id="backup-world" placeholder=""
                           style="width: 100%; padding: 10px; border-radius: 4px; background: #1a1a1a; color: #5fc78f !important; border: 1px solid #444; box-sizing: border-box;">
                </div>
                <button id="btn-backup-create" class="btn btn-save-small" style="width: 100%; justify-content: center; padding: 12px; font-weight: bold;" onclick="createBackup()">
                    <i class="fas fa-save" style="margin-right: 8px;"></i> Start Backup
                </button>
            </div>
        </div>

        <!-- CARD: SCHEDULING -->
        <div class="settings-card">
            <h3>Automatic Scheduling</h3>
            <div class="input-group" style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                <div class="field-container">
                    <label for="schedule-interval" style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc;">Backup Frequency</label>
                    <select id="schedule-interval" class="select-input"
                            style="width: 100%; padding: 10px; border-radius: 4px; background: #1a1a1a; color: white; border: 1px solid #444; cursor: pointer;">
                        <option value="none">Disabled</option>
                        <option value="12h">Every 12 hours</option>
                        <option value="daily">Daily (Early Morning 06:00 AM)</option>
                        <option value="weekly">Weekly (Monday)</option>
                    </select>
                </div>

                <button class="btn btn-filter active" style="width: 100%; justify-content: center; padding: 12px;" onclick="saveSchedule()">
                    <i class="fas fa-clock" style="margin-right: 8px;"></i> Save Schedule
                </button>
            </div>
        </div>
    </div>

    <!-- HISTORY TABLE -->
    <div class="settings-card mt-20">
        <h3>Stored Backups</h3>
        <div class="world-list-container">
            <table class="world-table" style="table-layout: fixed; width: 100%; border-collapse: collapse;">
                <thead>
                <tr style="text-align: left; border-bottom: 2px solid #333;">
                    <th style="width: 200px; padding: 12px;">Alias</th>
                    <th style="width: 250px;">File Name</th>
                    <th style="width: 160px;">Date</th>
                    <th style="width: 100px;">Size</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="backup-list-body">
                <!-- Example Row 2 -->
                <tr style="border-bottom: 1px solid #222;">
                    <td style="color: #e0e0e0; font-weight: 600;">Survival Mods</td>
                    <td style="font-size: 0.85em; color: #888;">Survival_20260428.zip</td>
                    <td>04/28/2026 15:40</td>
                    <td>1.2 GB</td>
                    <td style="text-align: right; display: flex; gap: 10px; justify-content: flex-end; padding: 12px 20px 12px 0;">
                        <button class="btn-select" onclick="restoreBackup('Survival_20260428.zip')">
                            <i class="fas fa-undo-alt"></i> Restore
                        </button>
                        <button class="btn-delete" onclick="deleteBackup('Survival_20260428.zip')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
